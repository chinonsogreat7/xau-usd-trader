[metadata]
name = xau-trader-research
version = 0.1.0
description = Paper-only research system for testing XAU/USD trading hypotheses
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    xau-trader = xau_trader.cli:main
